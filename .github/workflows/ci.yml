name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docs-and-links:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync Python dependencies
        run: uv sync --python 3.11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install docs dependencies
        run: npm ci

      - name: Check text encoding
        run: uv run cases\cupboard\scripts\verify_text_encoding.py

      - name: Check Markdown links
        run: uv run scripts\verify_tracked_markdown_links.py

      - name: Build docs
        run: npm run docs:build
